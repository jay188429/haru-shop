<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>하루상점 관리자</title>
  <script src="assets/consent.js"></script>
  <script async src="https://googletagmanager.com/gtag/js?id=G-MENCGV4RTE"></script>

    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}

    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-MQNWSZ93');

  <link rel="stylesheet" href="assets/style.css">
  <style>
    main { max-width: 720px; margin: 0 auto; padding: 48px 20px; }
    .admin-card { padding: 28px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
    .admin-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
    #admin-status { min-height: 28px; margin: 18px 0 0; white-space: pre-wrap; }
    #admin-account-info { margin-top: 12px; line-height: 1.8; }
    #product-admin { margin-top: 24px; }
    .product-admin-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .product-table-wrap { overflow-x: auto; margin-top: 16px; }
    .product-table { width: 100%; border-collapse: collapse; min-width: 760px; }
    .product-table th, .product-table td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    .product-thumbnail { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; display: block; }
    .product-table input[type="number"], .product-table input[type="text"] { width: 100%; min-width: 90px; padding: 7px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
    .product-editor { display: grid; grid-template-columns: repeat(3, minmax(120px, 1fr)); gap: 10px; align-items: end; }
    .product-editor input[type="file"] { max-width: 100%; }
    .product-editor label { display: grid; gap: 4px; }
    .product-error { color: #b42318; white-space: pre-wrap; }
    .product-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 16px; }
    .product-controls input, .product-controls select { padding: 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
    .product-count { margin: 14px 0 0; color: var(--sub); }
    .admin-tabs { display: flex; gap: 8px; margin: 24px 0 0; }
    .admin-tabs .active { outline: 3px solid rgba(138,90,43,.25); }
    .orders-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 16px 0; }
    .orders-list { display: grid; gap: 8px; }
    .order-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 12px; align-items: center; width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: inherit; text-align: left; font: inherit; cursor: pointer; }
    .order-row:hover { border-color: var(--accent); }
    .order-detail { margin-top: 18px; padding: 18px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
    .order-detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
    .order-detail dt { color: var(--sub); }
    .order-detail dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
    .order-error { color: #b42318; white-space: pre-wrap; min-height: 1.5em; }
    .order-confirm { margin-top: 16px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; }
    .order-confirm-actions { display: flex; gap: 8px; margin-top: 10px; }
  </style>
</head>
<body>
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MQNWSZ93"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

  <main>
    <h1>하루상점 관리 화면</h1>
    <section class="admin-card" aria-live="polite">
      <p id="admin-status">확인 중입니다.</p>
      <div id="admin-account-info"></div>
      <div id="admin-actions" class="admin-actions"></div>
    </section>
    <div id="admin-tabs" class="admin-tabs" hidden>
      <button id="products-tab" class="btn active" type="button">상품</button>
      <button id="orders-tab" class="btn ghost" type="button">주문</button>
    </div>
    <section id="product-admin" class="admin-card" hidden>
      <div class="product-admin-head">
        <h2>상품 관리</h2>
        <button id="new-product-button" class="btn" type="button">새 상품</button>
      </div>
      <form id="new-product-form" class="product-editor" hidden>
        <label>상품명<input name="name" type="text" required></label>
        <label>가격<input name="price" type="number" min="1" required></label>
        <label>설명<input name="summary" type="text" required></label>
        <label>재고<input name="stock" type="number" min="0" step="1" required></label>
        <label>사진<input name="photo" type="file" accept="image/*"></label>
        <button class="btn" type="submit">저장</button>
        <p id="new-product-progress" aria-live="polite"></p>
        <p id="new-product-error" class="product-error" aria-live="polite"></p>
      </form>
      <p id="product-load-error" class="product-error" aria-live="polite"></p>
      <div class="product-controls">
        <button class="btn ghost product-filter" type="button" data-filter="all">전체</button>
        <button class="btn ghost product-filter" type="button" data-filter="soldout">품절만</button>
        <button class="btn ghost product-filter" type="button" data-filter="hidden">숨김만</button>
        <button class="btn ghost product-filter" type="button" data-filter="removed">내린 상품</button>
        <input id="product-search" type="search" placeholder="상품명 검색" aria-label="상품명 검색">
        <select id="product-sort" aria-label="상품 정렬">
          <option value="default">정렬 없음</option>
          <option value="stock">재고 적은 순</option>
          <option value="name">이름순</option>
          <option value="updated">최근에 고친 순</option>
        </select>
      </div>
      <p id="product-count" class="product-count" aria-live="polite"></p>
      <div class="product-table-wrap">
        <table class="product-table">
          <thead><tr><th>문서 ID</th><th>사진</th><th>상품명</th><th>가격</th><th>재고</th><th>품절</th><th>노출</th><th>관리</th></tr></thead>
          <tbody id="product-table-body"></tbody>
        </table>
      </div>
      <p id="product-action-message" aria-live="polite"></p>
      <section id="recent-activity" class="admin-card">
        <h2>최근 활동</h2>
        <p id="recent-activity-error" class="product-error" aria-live="polite"></p>
        <div id="recent-activity-list"></div>
      </section>
    </section>
    <section id="orders-admin" class="admin-card" hidden>
      <h2>주문</h2>
      <div class="orders-controls">
        <label>상태
          <select id="order-status-filter">
            <option value="">전체</option>
            <option value="paid">paid</option>
            <option value="preparing">preparing</option>
            <option value="shipped">shipped</option>
            <option value="delivered">delivered</option>
            <option value="canceled">canceled</option>
          </select>
        </label>
      </div>
      <p id="orders-error" class="order-error" aria-live="polite"></p>
      <div id="orders-list" class="orders-list"></div>
      <button id="orders-more" class="btn ghost" type="button" hidden>더 보기</button>
      <div id="order-detail" class="order-detail" hidden></div>
    </section>
  </main>

  <script type="module">
    import { getIdToken } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-functions.js";
    import { addDoc, collection, deleteField, doc, getDoc, getDocs, getFirestore, limit, orderBy, query, serverTimestamp, startAfter, updateDoc, where } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
    import { getDownloadURL, getStorage, ref, uploadBytesResumable } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";
    import { app, auth, authReady } from "./assets/auth.js";

    const status = document.querySelector("#admin-status");
    const accountInfo = document.querySelector("#admin-account-info");
    const actions = document.querySelector("#admin-actions");
    const productAdmin = document.querySelector("#product-admin");
    const productBody = document.querySelector("#product-table-body");
    const productLoadError = document.querySelector("#product-load-error");
    const newProductButton = document.querySelector("#new-product-button");
    const newProductForm = document.querySelector("#new-product-form");
    const newProductProgress = document.querySelector("#new-product-progress");
    const newProductError = document.querySelector("#new-product-error");
    const productSearch = document.querySelector("#product-search");
    const productSort = document.querySelector("#product-sort");
    const productCount = document.querySelector("#product-count");
    const filterButtons = [...document.querySelectorAll(".product-filter")];
    const productActionMessage = document.querySelector("#product-action-message");
    const recentActivityError = document.querySelector("#recent-activity-error");
    const recentActivityList = document.querySelector("#recent-activity-list");
    const adminTabs = document.querySelector("#admin-tabs");
    const productsTab = document.querySelector("#products-tab");
    const ordersTab = document.querySelector("#orders-tab");
    const ordersAdmin = document.querySelector("#orders-admin");
    const orderStatusFilter = document.querySelector("#order-status-filter");
    const ordersError = document.querySelector("#orders-error");
    const ordersList = document.querySelector("#orders-list");
    const ordersMore = document.querySelector("#orders-more");
    const orderDetail = document.querySelector("#order-detail");
    const functions = getFunctions(app, "us-central1");
    const db = getFirestore(app);
    const storage = getStorage(app);
    const grantOwnerRole = httpsCallable(functions, "grantOwnerRole");
    let allProducts = [];
    let activeFilter = "all";
    const changedKeyLabels = {
      deletedAt: "내림 표시",
      isVisible: "노출",
      stock: "재고",
      price: "가격",
      name: "이름",
      summary: "설명",
      imagePath: "사진"
    };
    const orderPageSize = 20;
    let orderLastDoc = null;
    let orderHasMore = false;
    let orderLoading = false;
    let selectedOrder = null;

    const button = (label, handler) => {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "btn";
      item.textContent = label;
      item.addEventListener("click", handler);
      return item;
    };

    const errorText = error => String(error?.message || error);

    function numberValue(value, label, minimum) {
      const number = Number(value);
      if (!Number.isFinite(number) || !Number.isInteger(number) || number < minimum) {
        throw new Error(`${label}은(는) ${minimum} 이상의 숫자여야 합니다.`);
      }
      return number;
    }

    function textCell(value) {
      const cell = document.createElement("td");
      cell.textContent = value == null ? "" : String(value);
      return cell;
    }

    function validatePhoto(file) {
      if (!file || file.size === 0) return;
      if (file.size >= 5 * 1024 * 1024) {
        throw new Error("5MB 넘는 사진은 올릴 수 없습니다");
      }
      if (!file.type.startsWith("image/")) {
        throw new Error("이미지 파일만 올릴 수 있습니다");
      }
    }

    function uploadPhoto(path, file, onProgress) {
      const upload = uploadBytesResumable(ref(storage, path), file, { contentType: file.type });
      return new Promise((resolve, reject) => {
        upload.on("state_changed", snapshot => {
          onProgress(Math.round(snapshot.bytesTransferred / snapshot.totalBytes * 100));
        }, reject, resolve);
      });
    }

    function makeToggle(label, checked, onChange) {
      const cell = document.createElement("td");
      const input = document.createElement("input");
      input.type = "checkbox";
      input.checked = checked;
      input.setAttribute("aria-label", label);
      const errorLine = document.createElement("span");
      errorLine.className = "product-error";
      input.addEventListener("change", async () => {
        input.disabled = true;
        errorLine.textContent = "";
        try {
          await onChange(input);
        } catch (error) {
          input.checked = !input.checked;
          errorLine.textContent = errorText(error);
        } finally {
          input.disabled = false;
        }
      });
      cell.append(input, errorLine);
      return cell;
    }

    async function loadProducts() {
      productLoadError.textContent = "";
      productBody.replaceChildren();
      try {
        const snapshot = await getDocs(collection(db, "products"));
        allProducts = snapshot.docs
          .map(item => ({ id: item.id, ...item.data() }))
          .sort((a, b) => a.id.localeCompare(b.id));
        renderVisibleProducts();
        await loadRecentActivity();
      } catch (error) {
        productLoadError.textContent = errorText(error);
      }
    }

    function renderVisibleProducts() {
      const search = productSearch.value.trim().toLocaleLowerCase();
      let visibleProducts = allProducts.filter(product => {
        if (activeFilter === "soldout" && Number(product.stock) !== 0) return false;
        if (activeFilter === "hidden" && product.isVisible !== false) return false;
        if (activeFilter === "removed" && !product.deletedAt) return false;
        if (activeFilter !== "removed" && product.deletedAt) return false;
        return String(product.name || "").toLocaleLowerCase().includes(search);
      });
      if (productSort.value === "stock") {
        visibleProducts.sort((a, b) => Number(a.stock) - Number(b.stock));
      } else if (productSort.value === "name") {
        visibleProducts.sort((a, b) => String(a.name || "").localeCompare(String(b.name || ""), "ko"));
      } else if (productSort.value === "updated") {
        visibleProducts.sort((a, b) => {
          const aTime = a.updatedAt?.toMillis?.() ?? -1;
          const bTime = b.updatedAt?.toMillis?.() ?? -1;
          return bTime - aTime;
        });
      }
      productBody.replaceChildren();
      visibleProducts.forEach(renderProductRow);
      productCount.textContent = `지금 보이는 상품 ${visibleProducts.length}개 / 전체 ${allProducts.length}개`;
    }

    async function loadRecentActivity() {
      recentActivityError.textContent = "";
      recentActivityList.replaceChildren();
      try {
        const snapshot = await getDocs(query(collection(db, "adminLogs"), orderBy("at", "desc"), limit(10)));
        if (snapshot.empty) {
          recentActivityList.textContent = "아직 활동이 없습니다.";
          return;
        }
        snapshot.docs.forEach(logDoc => {
          const log = logDoc.data();
          const line = document.createElement("p");
          const time = log.at?.toDate?.().toLocaleString("ko-KR", { timeZone: "Asia/Seoul" }) || "시간 없음";
          const product = allProducts.find(item => item.id === log.productId);
          const changedKeys = Array.isArray(log.changedKeys) ? log.changedKeys.map(key => changedKeyLabels[key] || key).join(", ") : "";
          line.textContent = `${time} · ${product?.name || log.productId || "상품 없음"} · ${log.action || ""} · ${changedKeys}`;
          recentActivityList.append(line);
        });
      } catch (error) {
        recentActivityError.textContent = errorText(error);
      }
    }

    function orderTime(value) {
      return value?.toDate?.().toLocaleString("ko-KR", { timeZone: "Asia/Seoul" }) || "시간 없음";
    }

    function nextOrderStatus(statusValue) {
      return { paid: ["preparing", "포장 시작"], preparing: ["shipped", "배송 시작"], shipped: ["delivered", "배송 완료"] }[statusValue] || null;
    }

    function renderOrderDetail(order) {
      selectedOrder = order;
      orderDetail.replaceChildren();
      orderDetail.hidden = false;
      const title = document.createElement("h3");
      title.textContent = `주문 ${order.id}`;
      orderDetail.append(title);
      const details = document.createElement("dl");
      const fields = [
        ["주문 번호", order.id],
        ["산 것", JSON.stringify(order.items || [], null, 2)],
        ["금액", order.totalPrice ?? ""],
        ["상태", order.status || ""],
        ["받은 시각", order.receivedAt ? orderTime(order.receivedAt) : ""],
        ["처리 표시", order.processStatus || ""],
        ["메일 표시", order.mailStatus || ""],
        ["상태를 바꾼 시각", order.statusUpdatedAt ? orderTime(order.statusUpdatedAt) : ""]
      ];
      if (order.processError) fields.push(["처리 오류", order.processError]);
      fields.forEach(([label, value]) => {
        if (label === "메일 표시" && !order.mailStatus) return;
        if (label === "상태를 바꾼 시각" && !order.statusUpdatedAt) return;
        const term = document.createElement("dt");
        term.textContent = label;
        const description = document.createElement("dd");
        description.textContent = value == null ? "" : String(value);
        details.append(term, description);
      });
      orderDetail.append(details);

      const next = nextOrderStatus(order.status);
      if (next) {
        const changeButton = button(next[1], () => {
          const confirmBox = document.createElement("div");
          confirmBox.className = "order-confirm";
          const message = document.createElement("p");
          message.textContent = `주문 ${order.id}를 ${next[0]}로 바꿉니다`;
          const confirmActions = document.createElement("div");
          confirmActions.className = "order-confirm-actions";
          const cancelButton = button("그만두기", () => confirmBox.remove());
          const confirmButton = button("바꾸기", async () => {
            confirmButton.disabled = true;
            cancelButton.disabled = true;
            try {
              await updateDoc(doc(db, "orders", order.id), {
                status: next[0],
                statusUpdatedAt: serverTimestamp()
              });
              const refreshed = await getDoc(doc(db, "orders", order.id));
              renderOrderDetail({ id: refreshed.id, ...refreshed.data() });
              await loadOrders(true);
            } catch (error) {
              console.error(error);
              ordersError.textContent = "주문 상태를 바꾸지 못했습니다.";
              confirmButton.disabled = false;
              cancelButton.disabled = false;
            }
          });
          confirmActions.append(confirmButton, cancelButton);
          confirmBox.append(message, confirmActions);
          orderDetail.append(confirmBox);
        });
        orderDetail.append(changeButton);
      }
    }

    function renderOrderRow(order) {
      const row = document.createElement("button");
      row.type = "button";
      row.className = "order-row";
      const id = document.createElement("span");
      id.textContent = order.id;
      const amount = document.createElement("span");
      amount.textContent = `${order.totalPrice ?? ""}원`;
      const statusValue = document.createElement("span");
      statusValue.textContent = order.status || "";
      const created = document.createElement("span");
      created.textContent = orderTime(order.createdAt);
      row.append(id, amount, statusValue, created);
      row.addEventListener("click", () => renderOrderDetail(order));
      ordersList.append(row);
    }

    async function loadOrders(reset = false) {
      if (orderLoading) return;
      orderLoading = true;
      ordersError.textContent = "";
      if (reset) {
        orderLastDoc = null;
        orderHasMore = false;
        ordersList.replaceChildren();
        orderDetail.replaceChildren();
        orderDetail.hidden = true;
      }
      try {
        const constraints = [];
        if (orderStatusFilter.value) constraints.push(where("status", "==", orderStatusFilter.value));
        constraints.push(orderBy("createdAt", "desc"), limit(orderPageSize));
        if (orderLastDoc) constraints.splice(constraints.length - 1, 0, startAfter(orderLastDoc));
        const snapshot = await getDocs(query(collection(db, "orders"), ...constraints));
        snapshot.docs.map(item => ({ id: item.id, ...item.data() })).forEach(renderOrderRow);
        orderLastDoc = snapshot.docs.at(-1) || orderLastDoc;
        orderHasMore = snapshot.size === orderPageSize;
        ordersMore.hidden = !orderHasMore;
      } catch (error) {
        console.error(error);
        ordersError.textContent = "주문을 불러오지 못했습니다.";
        ordersMore.hidden = true;
      } finally {
        orderLoading = false;
      }
    }

    function showProductsTab() {
      productsTab.classList.add("active");
      productsTab.classList.remove("ghost");
      ordersTab.classList.remove("active");
      ordersTab.classList.add("ghost");
      productAdmin.hidden = false;
      ordersAdmin.hidden = true;
    }

    function showOrdersTab() {
      productsTab.classList.remove("active");
      productsTab.classList.add("ghost");
      ordersTab.classList.add("active");
      ordersTab.classList.remove("ghost");
      productAdmin.hidden = true;
      ordersAdmin.hidden = false;
      loadOrders(true);
    }

    productsTab.addEventListener("click", showProductsTab);
    ordersTab.addEventListener("click", showOrdersTab);
    orderStatusFilter.addEventListener("change", () => loadOrders(true));
    ordersMore.addEventListener("click", () => loadOrders(false));

    function renderProductRow(product) {
      const row = document.createElement("tr");
      const imageCell = document.createElement("td");
      if (product.imagePath) {
        const image = document.createElement("img");
        image.className = "product-thumbnail";
        image.alt = `${product.name || product.id} 사진`;
        image.src = "";
        getDownloadURL(ref(storage, product.imagePath)).then(url => {
          image.src = url;
          imageCell.append(image);
        }).catch(error => {
          imageCell.textContent = errorText(error);
        });
      }
      row.append(
        textCell(product.id),
        imageCell,
        textCell(product.name),
        textCell(product.price),
        textCell(product.stock)
      );
      row.append(makeToggle("품절", Number(product.stock) === 0, async input => {
        let stock = 0;
        if (!input.checked) {
          const entered = prompt("재고를 입력하세요. 1 이상의 정수만 가능합니다.");
          stock = numberValue(entered, "재고", 1);
        }
        await updateDoc(doc(db, "products", product.id), { stock, updatedAt: serverTimestamp() });
        await loadProducts();
      }));
      row.append(makeToggle("노출", product.isVisible !== false, async input => {
        await updateDoc(doc(db, "products", product.id), { isVisible: input.checked, updatedAt: serverTimestamp() });
        await loadProducts();
      }));

      const manage = document.createElement("td");
      const edit = button("고치기", () => openEditor(row, product));
      if (product.deletedAt) {
        manage.append(button("되돌리기", async () => {
          try {
            await updateDoc(doc(db, "products", product.id), {
              deletedAt: deleteField(),
              isVisible: true,
              updatedAt: serverTimestamp()
            });
            productActionMessage.textContent = `되돌렸습니다: ${product.name || product.id}`;
            await loadProducts();
          } catch (error) {
            productActionMessage.textContent = errorText(error);
          }
        }));
      } else {
        manage.append(button("내리기", async () => {
          if (!confirm(`『${product.name || product.id}』을 가게에서 내립니다`)) return;
          try {
            await updateDoc(doc(db, "products", product.id), {
              deletedAt: serverTimestamp(),
              isVisible: false,
              updatedAt: serverTimestamp()
            });
            productActionMessage.replaceChildren();
            const message = document.createElement("span");
            message.textContent = `${product.name || product.id}을 가게에서 내렸습니다. `;
            const restore = button("되돌리기", async () => {
              try {
                await updateDoc(doc(db, "products", product.id), {
                  deletedAt: deleteField(),
                  isVisible: true,
                  updatedAt: serverTimestamp()
                });
                productActionMessage.textContent = `되돌렸습니다: ${product.name || product.id}`;
                await loadProducts();
              } catch (error) {
                productActionMessage.textContent = errorText(error);
              }
            });
            productActionMessage.append(message, restore);
            await loadProducts();
          } catch (error) {
            productActionMessage.textContent = errorText(error);
          }
        }), edit);
      }
      row.append(manage);
      productBody.append(row);
    }

    function openEditor(row, product) {
      const editorRow = document.createElement("tr");
      const cell = document.createElement("td");
      cell.colSpan = 8;
      const form = document.createElement("form");
      form.className = "product-editor";
      form.innerHTML = `
        <label>가격<input name="price" type="number" min="1" value="${Number(product.price) || 0}" required></label>
        <label>설명<input name="summary" type="text" value="${product.summary || ""}" required></label>
        <label>재고<input name="stock" type="number" min="0" step="1" value="${Number(product.stock) || 0}" required></label>
        <label>사진<input name="photo" type="file" accept="image/*"></label>`;
      const save = button("저장", async () => {});
      save.type = "submit";
      const cancel = button("취소", () => editorRow.remove());
      const error = document.createElement("p");
      error.className = "product-error";
      const progress = document.createElement("p");
      form.append(save, cancel, progress, error);
      form.addEventListener("submit", async event => {
        event.preventDefault();
        save.disabled = true;
        error.textContent = "";
        progress.textContent = "";
        try {
          const values = new FormData(form);
          const photo = values.get("photo");
          validatePhoto(photo);
          await updateDoc(doc(db, "products", product.id), {
            price: numberValue(values.get("price"), "가격", 1),
            summary: values.get("summary"),
            stock: numberValue(values.get("stock"), "재고", 0),
            updatedAt: serverTimestamp()
          });
          if (photo && photo.size > 0) {
            const path = `products/${product.id}/main.jpg`;
            await uploadPhoto(path, photo, percent => {
              progress.textContent = `올리는 중 ${percent} %`;
            });
            await updateDoc(doc(db, "products", product.id), { imagePath: path, updatedAt: serverTimestamp() });
          }
          await loadProducts();
        } catch (updateError) {
          error.textContent = errorText(updateError);
        } finally {
          save.disabled = false;
        }
      });
      cell.append(form);
      editorRow.append(cell);
      row.after(editorRow);
    }

    newProductButton.addEventListener("click", () => {
      newProductForm.hidden = !newProductForm.hidden;
      newProductError.textContent = "";
      newProductProgress.textContent = "";
    });

    filterButtons.forEach(filterButton => {
      filterButton.addEventListener("click", () => {
        activeFilter = filterButton.dataset.filter;
        renderVisibleProducts();
      });
    });
    productSearch.addEventListener("input", renderVisibleProducts);
    productSort.addEventListener("change", renderVisibleProducts);

    newProductForm.addEventListener("submit", async event => {
      event.preventDefault();
      newProductError.textContent = "";
      try {
        const values = new FormData(newProductForm);
        const photo = values.get("photo");
        validatePhoto(photo);
        const product = await addDoc(collection(db, "products"), {
          name: values.get("name"),
          price: numberValue(values.get("price"), "가격", 1),
          summary: values.get("summary"),
          stock: numberValue(values.get("stock"), "재고", 0),
          isVisible: false,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        });
        if (photo && photo.size > 0) {
          const path = `products/${product.id}/main.jpg`;
          await uploadPhoto(path, photo, percent => {
            newProductProgress.textContent = `올리는 중 ${percent} %`;
          });
          await updateDoc(product, { imagePath: path, updatedAt: serverTimestamp() });
        }
        newProductForm.reset();
        newProductForm.hidden = true;
        await loadProducts();
      } catch (error) {
        newProductError.textContent = errorText(error);
      }
    });

    async function showAdmin(user) {
      actions.replaceChildren();
      if (!user) {
        status.textContent = "로그인이 필요합니다";
        accountInfo.replaceChildren();
        adminTabs.hidden = true;
        productAdmin.hidden = true;
        ordersAdmin.hidden = true;
        const link = document.createElement("a");
        link.href = "/login.html";
        link.textContent = "로그인 화면으로 이동";
        actions.append(link);
        return;
      }

      try {
        const tokenResult = await user.getIdTokenResult();
        const role = tokenResult.claims.role;
        accountInfo.replaceChildren();
        const emailLine = document.createElement("div");
        emailLine.textContent = `로그인 : ${user.email || ""}`;
        const issuedAtLine = document.createElement("div");
        const issuedAt = new Date(tokenResult.issuedAtTime).toLocaleString("ko-KR", {
          timeZone: "Asia/Seoul"
        });
        issuedAtLine.textContent = `토큰을 받은 시각 : ${issuedAt}`;
        accountInfo.append(emailLine, issuedAtLine);
        if (role === "staff" || role === "admin") {
          status.textContent = `관리자: ${role}`;
          adminTabs.hidden = false;
          showProductsTab();
          productAdmin.hidden = false;
          await loadProducts();
        } else {
          status.textContent = "권한이 없습니다";
          adminTabs.hidden = true;
          productAdmin.hidden = true;
          ordersAdmin.hidden = true;
          actions.append(button("주인 명찰 받기", async () => {
            try {
              await grantOwnerRole();
              await getIdToken(user, true);
              await showAdmin(user);
            } catch (error) {
              status.textContent = error.message;
            }
          }));
        }

        actions.append(button("다시 확인", async () => {
          await getIdToken(user, true);
          await showAdmin(user);
        }));
      } catch (error) {
        status.textContent = error.message;
        adminTabs.hidden = true;
        productAdmin.hidden = true;
        ordersAdmin.hidden = true;
      }
    }

    authReady.then(showAdmin);
  </script>
</body>
</html>
