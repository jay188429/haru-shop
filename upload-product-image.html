<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상품 사진 올리기 — 하루 상점</title>
  <link rel="stylesheet" href="assets/style.css">

  <!-- 동의 기본값 · 태그 관리자보다 먼저 -->
  <script src="assets/consent.js"></script>

  <!-- 태그 관리자 코드가 들어갈 자리 (머리) -->

<body>

<!-- 태그 관리자 코드가 들어갈 자리 (몸통 맨 위) -->

  <header class="site"><div class="wrap">
    <a class="brand" href="index.html">하루 상점</a>
    <nav class="site">
      <a href="index.html">상품</a>
      <a href="about.html">가게 소개</a>
      <a href="shipping.html">배송·교환</a>
      <a href="cart.html">장바구니<span class="cart-count">0</span></a>
    </nav>
  </div></header>

  <main><div class="wrap">
    <h1>상품 사진 올리기</h1>
    <p id="status" aria-live="polite">로그인 상태를 확인하는 중입니다.</p>
    <form id="upload-form" hidden>
      <label for="product">상품</label>
      <select id="product" required></select>
      <label for="image">사진</label>
      <input id="image" type="file" accept="image/*" required>
      <button class="btn" type="submit">사진 올리기</button>
    </form>
  </div></main>

  <footer class="site"><div class="wrap"></div></footer>
  <script src="assets/shop.js"></script>
  <script src="assets/app.js"></script>
  <script type="module">
    import { collection, doc, getDocs, getFirestore, updateDoc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytesResumable } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";
    import { app, authReady } from "./assets/auth.js";

    const db = getFirestore(app);
    const storage = getStorage(app);
    const form = document.querySelector("#upload-form");
    const productSelect = document.querySelector("#product");
    const imageInput = document.querySelector("#image");
    const status = document.querySelector("#status");

    authReady.then(async user => {
      if (!user) {
        status.textContent = "로그인이 필요합니다.";
        return;
      }

      try {
        const snapshot = await getDocs(collection(db, "products"));
        snapshot.docs
          .sort((a, b) => a.id.localeCompare(b.id))
          .forEach(product => {
            const option = document.createElement("option");
            option.value = product.id;
            option.textContent = `${product.id} — ${product.data().name || "이름 없음"}`;
            productSelect.append(option);
          });
        form.hidden = false;
        status.textContent = "상품과 사진을 골라 주세요.";
      } catch (error) {
        status.textContent = String(error);
      }
    });

    form.addEventListener("submit", event => {
      event.preventDefault();
      const productId = productSelect.value;
      const file = imageInput.files[0];
      if (!productId || !file) return;

      const path = `products/${productId}/main.jpg`;
      const upload = uploadBytesResumable(ref(storage, path), file);
      form.querySelector("button").disabled = true;
      status.textContent = "올리는 중 0%";

      upload.on("state_changed", snapshot => {
        const percent = Math.round(snapshot.bytesTransferred / snapshot.totalBytes * 100);
        status.textContent = `올리는 중 ${percent}%`;
      }, error => {
        form.querySelector("button").disabled = false;
        status.textContent = String(error);
      }, async () => {
        try {
          await updateDoc(doc(db, "products", productId), { imagePath: path });
          status.textContent = `${path}에 사진을 올렸습니다.`;
        } catch (error) {
          status.textContent = String(error);
        } finally {
          form.querySelector("button").disabled = false;
        }
      });
    });
  </script>
</body>
</html>
