<meta charset="utf-8">

<link rel="stylesheet" href="assets/style.css">

<body>
  <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MQNWSZ93"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<header class="site"><div class="wrap">
  <a class="brand" href="index.html">하루 상점</a>
  <nav class="site">
    <a href="index.html">상품</a>
    <a href="about.html">가게 소개</a>
    <a href="shipping.html">배송·교환</a>
    <a href="cart.html">장바구니<span class="cart-count">0</span></a>
  </nav>
</div></header>

<main id="mypage-content" hidden><div class="wrap">
  <h2>마이페이지</h2>
  <p id="order-status-notice" aria-live="polite" hidden>주문 상태가 바뀌었습니다</p>
  <p>로그인한 이메일</p>
  <p id="user-email"></p>
  <button class="btn" id="mypage-logout" type="button">로그아웃</button>
  <section id="my-orders">
    <h3>내 주문</h3>
    <ul id="order-list"></ul>
    <p id="orders-empty"></p>
    <p id="orders-listener-notice" hidden></p>
    <button class="btn" id="orders-recheck" type="button" hidden>다시 확인</button>
  </section>
</div></main>
<footer class="site"><div class="wrap"></div></footer>

<script type="module">
  import { sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
  import { collection, doc, getDocs, getFirestore, onSnapshot, query, updateDoc, where } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
  import { app, auth, authReady } from "./assets/auth.js";

  const db = getFirestore(app);

  const content = document.querySelector("#mypage-content");
  const email = document.querySelector("#user-email");
  const orderStatusNotice = document.querySelector("#order-status-notice");
  const orderList = document.querySelector("#order-list");
  const ordersEmpty = document.querySelector("#orders-empty");
  const listenerNotice = document.querySelector("#orders-listener-notice");
  const ordersRecheck = document.querySelector("#orders-recheck");
  let stopOrders = null;
  let noticeTimer = null;
  const knownStatuses = new Map();
  const cancelErrors = new Map();
  let latestOrdersSnapshot = null;
  const verificationNotice = document.createElement("p");
  verificationNotice.textContent = "이메일 인증이 필요합니다.";
  const resendVerification = document.createElement("button");
  resendVerification.className = "btn";
  resendVerification.type = "button";
  resendVerification.textContent = "인증 메일 다시 보내기";
  content.querySelector(".wrap").insertBefore(verificationNotice, document.querySelector("#mypage-logout"));
  content.querySelector(".wrap").insertBefore(resendVerification, document.querySelector("#mypage-logout"));
  verificationNotice.hidden = true;
  resendVerification.hidden = true;

  const paintVerificationState = (user) => {
    const unverified = !user.emailVerified;
    verificationNotice.hidden = !unverified;
    resendVerification.hidden = !unverified;
  };

  const formatOrderDate = timestamp => {
    if (!timestamp || typeof timestamp.toDate !== "function") return "날짜 없음";
    return timestamp.toDate().toLocaleString("ko-KR");
  };

  const statusLabels = {
    paid: "결제 완료",
    preparing: "상품 준비 중",
    shipped: "배송 중",
    delivered: "배송 완료",
    canceled: "주문 취소"
  };
  const statusSteps = [
    ["paid", "결제 완료"],
    ["preparing", "상품 준비 중"],
    ["shipped", "배송 중"],
    ["delivered", "배송 완료"]
  ];

  const renderOrders = snapshot => {
    latestOrdersSnapshot = snapshot;
    const orders = snapshot.docs
      .map(order => ({ id: order.id, ...order.data() }))
      .sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));

    orderList.replaceChildren();
    ordersEmpty.textContent = orders.length ? "" : "주문 내역이 없습니다.";
    orders.forEach(order => {
      const itemNames = (order.items || []).map(item => item.name).join(", ");
      const item = document.createElement("li");
      const summary = document.createElement("p");
      summary.textContent = `${formatOrderDate(order.createdAt)} · ${itemNames} · ${order.totalPrice}원 · ${statusLabels[order.status] || "확인 중"}`;
      item.append(summary);

      if (order.status !== "canceled") {
        const steps = document.createElement("ol");
        steps.className = "order-steps";
        statusSteps.forEach(([value, label]) => {
          const step = document.createElement("li");
          step.textContent = label;
          if (order.status === value) {
            step.className = "current";
            step.setAttribute("aria-current", "step");
            step.style.fontWeight = "700";
          }
          steps.append(step);
        });
        item.append(steps);
      }

      if (order.status === "paid") {
        const cancelButton = document.createElement("button");
        cancelButton.className = "btn";
        cancelButton.type = "button";
        cancelButton.textContent = "주문 취소";
        cancelButton.addEventListener("click", async () => {
          cancelButton.disabled = true;
          cancelButton.textContent = "저장 중";
          cancelErrors.delete(order.id);
          try {
            await updateDoc(doc(db, "orders", order.id), { status: "canceled" });
          } catch (error) {
            cancelErrors.set(order.id, "주문이 취소되지 않았어요. 이 주문은 지금 취소 전 상태 그대로예요. 주문 취소를 한 번 더 눌러 주세요.");
            if (latestOrdersSnapshot) renderOrders(latestOrdersSnapshot);
          }
        });
        item.append(cancelButton);
        if (cancelErrors.has(order.id)) {
          const cancelError = document.createElement("p");
          cancelError.textContent = cancelErrors.get(order.id);
          item.append(cancelError);
        }
      }
      orderList.append(item);
    });
  };

  const showOrderStatusNotice = () => {
    orderStatusNotice.hidden = false;
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(() => {
      orderStatusNotice.hidden = true;
    }, 3000);
  };

  const readOrdersOnce = async uid => {
    const ordersQuery = query(
      collection(db, "orders"),
      where("userId", "==", uid)
    );
    const snapshot = await getDocs(ordersQuery);
    renderOrders(snapshot);
  };

  authReady.then(async user => {
    if (!user) {
      location.href = "login.html?next=mypage.html";
      return;
    }

    await user.reload();
    user = auth.currentUser;
    email.textContent = user.email;
    paintVerificationState(user);
    content.hidden = false;

    const ordersQuery = query(
      collection(db, "orders"),
      where("userId", "==", user.uid)
    );
    stopOrders = onSnapshot(ordersQuery, snapshot => {
      console.log("[주문 알림]", snapshot.docs.length);
      let statusChanged = false;
      snapshot.docChanges().forEach(change => {
        if (change.type === "removed") {
          knownStatuses.delete(change.doc.id);
          return;
        }
        const currentStatus = change.doc.data().status;
        const previousStatus = knownStatuses.get(change.doc.id);
        if (change.type === "modified" && previousStatus !== currentStatus) {
          statusChanged = true;
        }
        knownStatuses.set(change.doc.id, currentStatus);
      });
      renderOrders(snapshot);
      if (statusChanged) showOrderStatusNotice();

      const orders = snapshot.docs.map(order => order.data());
      const allFinished = orders.length > 0 && orders.every(order => ["delivered", "canceled"].includes(order.status));
      if (allFinished && stopOrders) {
        stopOrders();
        stopOrders = null;
        listenerNotice.textContent = "마이페이지를 닫으면 주문 확인을 멈춥니다. 다시 열면 최신 주문 내역을 확인합니다.";
        listenerNotice.hidden = false;
        ordersRecheck.hidden = false;
        console.log("[그만 듣기] 모든 주문이 종료되었습니다.");
      }
    });

    ordersRecheck.addEventListener("click", async () => {
      ordersRecheck.disabled = true;
      try {
        await readOrdersOnce(user.uid);
      } finally {
        ordersRecheck.disabled = false;
      }
    });
  });

  resendVerification.addEventListener("click", async () => {
    try {
      await sendEmailVerification(auth.currentUser);
    } catch (error) {
      if (error.code === "auth/too-many-requests") {
        verificationNotice.textContent = "잠시 뒤에 다시 눌러 주세요.";
        verificationNotice.hidden = false;
      }
    }
  });

  document.querySelector("#mypage-logout").addEventListener("click", async () => {
    await signOut(auth);
    location.href = "index.html";
  });
</script>
</body>
</html>
