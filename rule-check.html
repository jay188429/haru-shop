<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>규칙 확인 화면 — 하루 상점</title>
  <link rel="stylesheet" href="assets/style.css">

  <!-- 동의 기본값 · 태그 관리자보다 먼저 -->
  <script src="assets/consent.js"></script>

new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],

  <style>
    .rule-check p { margin: 6px 0 18px; }
    .rule-check .identity { color: var(--sub); }
    .rule-check .check { margin: 0 0 24px; }
    .rule-check .result { min-height: 24px; color: var(--sub); overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MQNWSZ93"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

  <header class="site"><div class="wrap">
    <a class="brand" href="index.html">하루 상점</a>
    <nav class="site">
      <a href="index.html">상품</a>
      <a href="about.html">가게 소개</a>
      <a href="shipping.html">배송·교환</a>
      <a href="cart.html">장바구니<span class="cart-count">0</span></a>
    </nav>
  </div></header>

  <main><div class="wrap rule-check">
    <h1>규칙 확인 화면</h1>
    <p class="identity" id="identity">로그인 상태를 확인하는 중입니다.</p>

    <section class="check">
      <button class="btn" id="read-all" type="button" hidden>주문 전체 읽기</button>
      <p class="result" id="read-all-result" aria-live="polite"></p>
    </section>

    <section class="check">
      <button class="btn" id="update-own-order" type="button" hidden>내 주문 금액 고치기</button>
      <p class="result" id="update-own-order-result" aria-live="polite"></p>
    </section>

    <section class="check">
      <button class="btn" id="update-price" type="button" hidden>상품 가격 0원으로</button>
      <p class="result" id="update-price-result" aria-live="polite"></p>
    </section>
  </div></main>

  <footer class="site"><div class="wrap"></div></footer>
  <script src="assets/shop.js"></script>
  <script src="assets/app.js"></script>
  <script type="module">
    import { collection, doc, getDocs, getFirestore, query, updateDoc, where } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
    import { app, authReady } from "./assets/auth.js";

    const db = getFirestore(app);
    const identity = document.querySelector("#identity");
    const buttons = [...document.querySelectorAll(".rule-check button")];

    function showResult(id, action) {
      const result = document.querySelector(`#${id}`);
      action()
        .then(() => { result.textContent = "허용 · 성공"; })
        .catch(error => { result.textContent = `거부 · 실패: ${String(error)}`; });
    }

    authReady.then(user => {
      if (!user) {
        identity.textContent = "로그인이 필요합니다.";
        return;
      }

      identity.textContent = `이메일: ${user.email || "없음"} · UID: ${user.uid}`;
      buttons.forEach(button => { button.hidden = false; });

      document.querySelector("#read-all").addEventListener("click", () => {
        showResult("read-all-result", () => getDocs(collection(db, "orders")));
      });

      document.querySelector("#update-own-order").addEventListener("click", () => {
        showResult("update-own-order-result", async () => {
          const snapshot = await getDocs(query(collection(db, "orders"), where("userId", "==", user.uid)));
          if (snapshot.empty) throw new Error("내 주문이 없습니다");
          await updateDoc(doc(db, "orders", snapshot.docs[0].id), { totalPrice: 1 });
        });
      });

      document.querySelector("#update-price").addEventListener("click", () => {
        showResult("update-price-result", () => updateDoc(doc(db, "products", "p1"), { price: 0 }));
      });
    });
  </script>
</body>
</html>
